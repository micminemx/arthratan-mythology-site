<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to Arthitean Codex...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #d7a6ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 14px; color: #b9abc9; }
  </style>
  <script>
    // GitHub Pages SPA Direct-Path Interceptor
    (function() {
      var path = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      
      // Clean leading and trailing slashes
      var clean = path.replace(/^\/+|\/+$/g, '');
      
      // Direct path to SPA route mapping
      if (clean.indexOf('masterpages/') === 0 || clean.indexOf('masterpage/') === 0) {
        var id = clean.replace(/^masterpages?\//, '');
        window.location.replace('/#masterpage:' + id + search + hash);
      } else if (clean.indexOf('masterpage:') === 0) {
        window.location.replace('/#' + clean + search + hash);
      } else if (clean === 'masterpages') {
        window.location.replace('/#masterpages' + search + hash);
      } else if (clean.indexOf('concepts/') === 0 || clean.indexOf('concept/') === 0) {
        var id = clean.replace(/^concepts?\//, '');
        window.location.replace('/#masterpage:' + id + search + hash);
      } else if (clean.indexOf('characters/') === 0 || clean.indexOf('character/') === 0) {
        var slug = clean.replace(/^characters?\//, '');
        // Slug canonical normalization
        var slugMap = {
          'empress-rhayhara': 'rhayhara',
          'asmouth': 'asmouth-varvadeil',
          'annaris': 'annaris-deyhamora',
          'qai-lyth': 'qailyth',
          'qai\'lyth': 'qailyth',
          'orotus': 'holy-black-phoenix'
        };
        var targetSlug = slugMap[slug] || slug;
        if (targetSlug === 'rhayhara') {
          window.location.replace('/#rhayhara' + search + hash);
        } else {
          window.location.replace('/#character:' + targetSlug + search + hash);
        }
      } else if (clean === 'rhayhara') {
        window.location.replace('/#rhayhara' + search + hash);
      } else if (clean === 'scaling' || clean === 'metagovernance') {
        window.location.replace('/#scaling' + search + hash);
      } else if (clean === 'negative-rewrite') {
        window.location.replace('/#negative-rewrite' + search + hash);
      } else if (clean === 'arthiteans') {
        window.location.replace('/#arthiteans' + search + hash);
      } else if (clean === 'atlas') {
        window.location.replace('/#atlas' + search + hash);
      } else if (clean === 'sources') {
        window.location.replace('/#sources' + search + hash);
      } else if (clean.indexOf('divine-section:') === 0 || clean.indexOf('divine-section/') === 0) {
        var sec = clean.replace(/^divine-section[:\/]/, '');
        window.location.replace('/#divine-section:' + sec + search + hash);
      } else if (clean.indexOf('hgl-part:') === 0 || clean.indexOf('hgl-part/') === 0) {
        var part = clean.replace(/^hgl-part[:\/]/, '');
        window.location.replace('/#hgl-part:' + part + search + hash);
      } else if (clean.indexOf('hgl-page-direct:') === 0 || clean.indexOf('hgl-page/') === 0) {
        var pg = clean.replace(/^hgl-page(-direct)?[:\/]/, '');
        window.location.replace('/#hgl-page-direct:' + pg + search + hash);
      } else if (clean) {
        window.location.replace('/#' + clean + search + hash);
      } else {
        window.location.replace('/#home' + search + hash);
      }
    })();
  </script>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p>Navigating to canonical Codex view...</p>
  </div>
</body>
</html>
