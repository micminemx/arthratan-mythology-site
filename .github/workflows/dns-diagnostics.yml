name: Diagnose custom-domain routing

on:
  push:
    paths:
      - ".github/workflows/dns-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query public DNS and live origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "=== arthratanmythology.com A ==="
          curl -fsSL "https://dns.google/resolve?name=arthratanmythology.com&type=A" | jq -r '.Answer[]? | [.name,.type,.TTL,.data] | @tsv'
          echo "=== arthratanmythology.com AAAA ==="
          curl -fsSL "https://dns.google/resolve?name=arthratanmythology.com&type=AAAA" | jq -r '.Answer[]? | [.name,.type,.TTL,.data] | @tsv'
          echo "=== arthratanmythology.com CAA ==="
          curl -fsSL "https://dns.google/resolve?name=arthratanmythology.com&type=CAA" | jq -r '.Answer[]? | [.name,.type,.TTL,.data] | @tsv'
          echo "=== arthratanmythology.com NS ==="
          curl -fsSL "https://dns.google/resolve?name=arthratanmythology.com&type=NS" | jq -r '.Answer[]? | [.name,.type,.TTL,.data] | @tsv'
          echo "=== www CNAME ==="
          curl -fsSL "https://dns.google/resolve?name=www.arthratanmythology.com&type=CNAME" | jq -r '.Answer[]? | [.name,.type,.TTL,.data] | @tsv'

          echo "=== GitHub Pages API state ==="
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{status,cname,https_enforced,protected_domain_state,pending_domain_unverified_at,https_certificate}' || true

          echo "=== HTTP headers ==="
          curl -sSIL --max-time 20 http://arthratanmythology.com/ | sed -n '1,30p' || true
          echo "=== HTTPS headers ==="
          curl -sSIL --max-time 20 https://arthratanmythology.com/ | sed -n '1,30p' || true
          echo "=== certificate subject/issuer/dates ==="
          echo | openssl s_client -servername arthratanmythology.com -connect arthratanmythology.com:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true

          echo "=== exact live HTTP publication checks ==="
          curl -fsSL --max-time 30 http://arthratanmythology.com/ -o /tmp/live-index.html
          curl -fsSL --max-time 30 http://arthratanmythology.com/app.js -o /tmp/live-app.js
          curl -fsSL --max-time 30 http://arthratanmythology.com/styles.css -o /tmp/live-styles.css
          curl -fsSL --max-time 30 http://arthratanmythology.com/data/characters.json -o /tmp/live-characters.json
          wc -c /tmp/live-index.html /tmp/live-app.js /tmp/live-styles.css /tmp/live-characters.json
          sha256sum /tmp/live-index.html /tmp/live-app.js /tmp/live-styles.css /tmp/live-characters.json
          node - <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/live-characters.json', 'utf8'));
          console.log(`LIVE_CHARACTER_COUNT=${j.characters?.length}`);
          if (!Array.isArray(j.characters) || j.characters.length !== 43) process.exit(1);
          NODE

          echo "=== HTTPS content probe ignoring current certificate mismatch ==="
          curl -kfsSL --max-time 30 https://arthratanmythology.com/data/characters.json -o /tmp/live-characters-https-unverified.json || true
          if [ -s /tmp/live-characters-https-unverified.json ]; then
            wc -c /tmp/live-characters-https-unverified.json
            sha256sum /tmp/live-characters-https-unverified.json
          fi
          # certificate-state verification 2026-08-31T20:01+01:00
