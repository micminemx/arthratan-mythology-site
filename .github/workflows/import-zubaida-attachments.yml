name: Import Zubaida source attachments
on:
  push:
    paths:
      - '.github/workflows/import-zubaida-attachments.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original Gmail attachment bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'sources/zubaida/attachments/19fdb1794050bc43'
          mkdir -p 'sources/zubaida/attachments/19fa076eb25a917b'
          mkdir -p 'sources/zubaida/attachments/19f9518411db997b'
          curl -fL --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-1378-8210-9878-99534afc7e4c/raw?se=2026-09-02T16%3A47%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=278cee78-80e3-5c72-9081-fb12dc8c336f&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-01T23%3A28%3A02Z&ske=2026-09-02T23%3A28%3A02Z&sks=b&skv=2026-02-06&sig=qh/tOM7a4pc3x/%2BO6bPviQ5ry2GJmitddjLix0M4NKg%3D' -o 'sources/zubaida/attachments/19fdb1794050bc43/IMG_0998.jpg'
          curl -fL --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-7538-8210-b00b-c69ab14a31a6/raw?se=2026-09-02T16%3A47%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=58897600-95b4-5d3a-9118-ceaac785a21d&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T09%3A40%3A51Z&ske=2026-09-03T09%3A40%3A51Z&sks=b&skv=2026-02-06&sig=y0OZql2SKJ2as4nliAbsODSy3b4AAVb6diNyUDVqbu4%3D' -o 'sources/zubaida/attachments/19fdb1794050bc43/IMG_1001.jpg'
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-f080-81f4-9cf8-b88da4eb44aa/raw?se=2026-09-02T16%3A47%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=88bf787a-17cb-5366-a6a1-35519feeab3a&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T07%3A15%3A30Z&ske=2026-09-03T07%3A15%3A30Z&sks=b&skv=2026-02-06&sig=WMbGpby7foa9zxBVY%2BAE2cm7zHGXa6KakAcLPYJ4itI%3D' -o 'sources/zubaida/attachments/19fa076eb25a917b/5ce96d29-7675-47a1-a429-748caaa425ea.png'
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-349c-81f4-9196-8e3633af03b9/raw?se=2026-09-02T16%3A47%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=2a3cfa2d-ce67-5243-a32d-932438a1d793&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T10%3A31%3A19Z&ske=2026-09-03T10%3A31%3A19Z&sks=b&skv=2026-02-06&sig=H3wdjW%2B96pFIepEYjloFeVfmFCWSDU3oj2ULtMriKZM%3D' -o 'sources/zubaida/attachments/19f9518411db997b/Vaelath.jpeg'
      - name: Commit preserved bytes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/zubaida/attachments/19fdb1794050bc43 sources/zubaida/attachments/19fa076eb25a917b sources/zubaida/attachments/19f9518411db997b
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve Zubaida attachment batch 19fdb-19f951'
          git push
