name: Import Zubaida source attachments
on:
  push:
    paths:
      - '.github/workflows/import-zubaida-attachments.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original Gmail attachment bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'sources/zubaida/attachments/19f88f41fb16946b' 'sources/zubaida/attachments/19f7746193ee07dc' 'sources/zubaida/attachments/19f1c2356873a90c'
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-66ec-81f4-8907-61fb7d89a1d3/raw?se=2026-09-02T16%3A50%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=e468b022-13ef-506e-9a9c-2f59aa892b18&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T06%3A30%3A57Z&ske=2026-09-03T06%3A30%3A57Z&sks=b&skv=2026-02-06&sig=tCXgqnc%2B/eRmOnUd1hqRdxZ73NtYXHUTTDNyQ6vMVW8%3D' -o 'sources/zubaida/attachments/19f88f41fb16946b/1.png'
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9e48-81f4-8373-e4922ee96957/raw?se=2026-09-02T16%3A50%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=f3980233-5515-5dfb-a8ad-e7ad66785a25&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-01T22%3A40%3A27Z&ske=2026-09-02T22%3A40%3A27Z&sks=b&skv=2026-02-06&sig=awf9UBroPOGFDJS0G7jW4MgEEkUsySN3aAQLaQxbl4M%3D' -o 'sources/zubaida/attachments/19f88f41fb16946b/2.png'
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7ef4-81f4-9862-1c2f926b5d26/raw?se=2026-09-02T16%3A50%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=1a4e0616-715c-57bb-9b92-e6ed6e652bda&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T08%3A50%3A29Z&ske=2026-09-03T08%3A50%3A29Z&sks=b&skv=2026-02-06&sig=nzAj3lxo5iyiz6vNdkS3Q7DSJQ2XoToIi%2B8CWz4uzdY%3D' -o 'sources/zubaida/attachments/19f7746193ee07dc/200 iq.PNG'
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7cdc-81f4-b8e8-f1d8531295b4/raw?se=2026-09-02T16%3A50%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=7053c7a8-3a62-5907-8aac-6bdb552c0745&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-01T23%3A34%3A55Z&ske=2026-09-02T23%3A34%3A55Z&sks=b&skv=2026-02-06&sig=3Lvlo1nyvRECrDdcRT9a5owwIlkAA4xLmzQ6ZiYh3fI%3D' -o 'sources/zubaida/attachments/19f1c2356873a90c/ffffffffff.PNG'
      - name: Commit preserved bytes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/zubaida/attachments/19f88f41fb16946b sources/zubaida/attachments/19f7746193ee07dc sources/zubaida/attachments/19f1c2356873a90c
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve Zubaida attachment batch 19f88-19f1c'
          git push
