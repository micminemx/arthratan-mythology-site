name: Zubaida attachment import archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report import state
        run: |
          echo 'Transport-only signed URLs have been removed from version control.'
          echo 'See data/zubaida-attachments.json and data/zubaida-integrity-audit.json for the persistent attachment state.'
          echo 'Any remaining unsupported HEIC recovery is performed from the Gmail raw-MIME source, never from stale transport URLs.'
