name: Verify live Zubaida source archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'archive.js'
      - 'archive.css'
      - 'data/zubaida-index.json'
      - 'data/zubaida-nonsource.json'
      - 'data/zubaida-attachments.json'
      - 'sources/zubaida/**'
      - '.github/workflows/verify-live-archive.yml'

permissions:
  contents: read

concurrency:
  group: zubaida-live-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium verifier
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify custom domain in Chromium
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          cat > verify-live.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';
          const base='https://arthratanmythology.com/';
          const sha=process.env.EXPECTED_SHA;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const report={generated_at:new Date().toISOString(),expected_sha:sha,base,checks:{},details:{}};
          const check=(k,v,d)=>{report.checks[k]=!!v;if(d!==undefined)report.details[k]=d};
          const releaseFiles=['index.html','archive.js','archive.css','data/zubaida-index.json','data/zubaida-nonsource.json'];
          let diff=[];
          for(let attempt=0;attempt<30;attempt++){
            diff=[];
            for(const rel of releaseFiles){
              const r=await fetch(`${base}${rel}?release=${sha}`,{cache:'no-store'});
              const live=r.ok?Buffer.from(await r.arrayBuffer()):Buffer.alloc(0);
              const local=fs.readFileSync(rel);
              if(!r.ok||hash(live)!==hash(local))diff.push({rel,status:r.status});
            }
            if(!diff.length)break;
            await sleep(5000);
          }
          check('custom_domain_matches_candidate_surface',!diff.length,diff);
          if(diff.length){fs.writeFileSync('zubaida-live-verification.json',JSON.stringify(report,null,2)+'\n');process.exit(1)}

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];
          page.on('pageerror',e=>errors.push(`pageerror: ${e}`));
          page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});
          const goto=hash=>page.goto(`${base}?release=${sha}${hash}`,{waitUntil:'networkidle',timeout:45000});

          const home=await goto('');
          check('homepage_loads',!!home?.ok());
          check('story_archive_visible_in_navigation',await page.locator('a[href="#stories"]').count()>0);
          await goto('#stories');
          await page.waitForSelector('.transmission-card h3',{timeout:30000});
          const stats=await page.locator('.transmission-stat b').allTextContents();
          const listStatus=String(await page.locator('#txStatus').textContent());
          check('archive_opens',await page.locator('h1').filter({hasText:'Story & Thread Archive'}).count()>0);
          check('archive_reports_128_118_10',JSON.stringify(stats.slice(0,3))===JSON.stringify(['128','118','10']),stats);
          check('archive_list_accounts_for_118_sources',listStatus.includes('118 matching preserved transmissions'),listStatus);

          const corpus=await page.evaluate(async()=>{
            const [i,n]=await Promise.all([fetch('data/zubaida-index.json',{cache:'no-store'}),fetch('data/zubaida-nonsource.json',{cache:'no-store'})]);
            const index=await i.json(),non=await n.json(),rows=non.non_source_records||non.ids||[],excluded=new Set(rows.map(r=>r.id));
            return{ids:index.ids.filter(id=>!excluded.has(id)),nonIds:[...excluded]};
          });
          check('derived_source_count_is_118',corpus.ids.length===118,corpus.ids.length);
          check('derived_nonsource_count_is_10',corpus.nonIds.length===10,corpus.nonIds.length);
          const crawl=await page.evaluate(async ids=>{
            const rows=await Promise.all(ids.map(async id=>{const r=await fetch(`sources/zubaida/${id}.txt`,{cache:'no-store'});const t=r.ok?await r.text():'';return{ id,ok:r.ok&&!!t.trim(),status:r.status,bytes:t.length}}));
            return rows.filter(x=>!x.ok);
          },corpus.ids);
          check('all_118_source_files_publicly_reachable',crawl.length===0,crawl);

          const samples=[corpus.ids[0],corpus.ids[Math.floor(corpus.ids.length/2)],corpus.ids.at(-1)],sampleResults=[];
          for(const id of samples){
            await goto(`#transmission:${id}`);await page.waitForSelector('.tx-source',{timeout:30000});
            const rendered=await page.locator('.tx-source').textContent();
            const source=await page.evaluate(async id=>await(await fetch(`sources/zubaida/${id}.txt`,{cache:'no-store'})).text(),id);
            sampleResults.push({id,exact:rendered===source,chars:source.length});
          }
          check('first_middle_final_source_render_exactly',sampleResults.every(x=>x.exact&&x.chars>0),sampleResults);

          await goto('#stories');await page.waitForSelector('#txSearch');
          const needle=corpus.ids[Math.floor(corpus.ids.length/2)].slice(0,8);
          await page.locator('#txSearch').fill(needle);await page.waitForTimeout(800);
          const searchStatus=String(await page.locator('#txStatus').textContent());
          check('archive_search_works',searchStatus.includes('1 matching preserved transmission'),{needle,searchStatus});

          const direct=samples[1];await goto(`#transmission:${direct}`);await page.waitForSelector('.tx-source');
          await page.reload({waitUntil:'networkidle',timeout:45000});await page.waitForSelector('.tx-source');
          check('transmission_deep_link_survives_reload',page.url().includes(`#transmission:${direct}`));

          await goto('#stories');await page.waitForSelector('.transmission-card');await page.locator('.transmission-card').first().click();await page.waitForSelector('.tx-source');
          await page.goBack({waitUntil:'networkidle',timeout:45000});await page.waitForSelector('.transmission-card');const back=page.url().includes('#stories');
          await page.goForward({waitUntil:'networkidle',timeout:45000});await page.waitForSelector('.tx-source');
          check('browser_back_forward_works',back&&page.url().includes('#transmission:'));

          await page.setViewportSize({width:390,height:844});await goto('#stories');await page.waitForSelector('.transmission-card');
          const a=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
          await goto(`#transmission:${samples[0]}`);await page.waitForSelector('.tx-source');
          const r=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
          check('mobile_has_no_material_horizontal_overflow',a<=2&&r<=2,{archiveOverflow:a,readerOverflow:r});
          check('no_uncaught_browser_console_errors',errors.length===0,errors);
          report.complete=Object.values(report.checks).every(Boolean);
          await browser.close();fs.writeFileSync('zubaida-live-verification.json',JSON.stringify(report,null,2)+'\n');
          if(!report.complete)process.exit(1);
          NODE
          node verify-live.mjs
      - name: Publish verification summary
        if: always()
        run: |
          if [ -f zubaida-live-verification.json ]; then
            echo '## Zubaida custom-domain verification' >> "$GITHUB_STEP_SUMMARY"
            echo "Candidate: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat zubaida-live-verification.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zubaida-live-verification-${{ github.sha }}
          path: zubaida-live-verification.json
          if-no-files-found: warn
