name: SEARCH-001/002 Unified Search Corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'sources/zubaida/**'
      - 'characters/**'
      - 'divine/**'
      - 'hgl/**'
      - 'myths/**'
      - 'crossscaling/**'
      - 'scripts/build-search-index.py'
      - 'scripts/build-static-search.py'
      - '.github/workflows/build-search-index.yml'

permissions:
  contents: write

concurrency:
  group: search-index-main
  cancel-in-progress: true

jobs:
  build-search-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate deterministic search shards
        env:
          SEARCH_SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/build-search-index.py

      - name: Generate static no-JavaScript search surface
        run: python scripts/build-static-search.py

      - name: Validate search corpus and static discovery contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          manifest=json.load(open(root/'data/search-index.json', encoding='utf-8'))
          meta=manifest['meta']
          assert meta['records'] == sum(s['records'] for s in manifest['shards'])
          assert meta['coverage']['characters'] == 43
          assert meta['coverage']['zubaida_source_transmissions'] == 118
          assert meta['coverage']['divine_sections'] == 317
          assert meta['coverage']['hgl_pages'] == 293
          assert meta['coverage']['myth_routes'] >= 1
          assert meta['coverage']['crossscaling_routes'] >= 1
          assert meta['validation']['unique_ids'] is True
          assert meta['validation']['routes_present'] is True
          assert meta['validation']['source_paths_present'] is True
          assert meta['validation']['crossscaling_noncanon_boundary'] is True
          records=[]
          for shard in manifest['shards']:
              p=root/shard['path'].lstrip('/')
              assert p.exists(), p
              payload=json.load(open(p, encoding='utf-8'))
              assert len(payload['records']) == shard['records']
              records.extend(payload['records'])
          ids=[r['id'] for r in records]
          assert len(ids) == len(set(ids)) == meta['records']
          dyvane=[r for r in records if r['title'].casefold() == 'dyvane redalious']
          assert dyvane and dyvane[0]['route'] == '/characters/dyvane-redalious/'
          assert any('hypernegative rewrite' in (r['title']+' '+' '.join(r['keywords'])).casefold() for r in records)
          myths=[r for r in records if r['type']=='myth']
          scales=[r for r in records if r['type']=='crossscaling']
          assert any(r['route']=='/myths/dyvane-vs-xael-gath/' for r in myths)
          assert any(r['route'].startswith('/crossscaling/') and r['route']!='/crossscaling/' for r in scales)
          assert all('noncanon' in r['snippet'].casefold() for r in scales)
          page=(root/'search/index.html').read_text(encoding='utf-8')
          plain=(root/'search/index.txt').read_text(encoding='utf-8')
          assert '<main id="results"' in page
          assert 'Dyvane Redalious' in page
          assert 'href="/characters/dyvane-redalious/"' in page
          assert 'href="/myths/dyvane-vs-xael-gath/"' in page
          assert 'JavaScript is optional' in page
          assert 'Dyvane Redalious | character | /characters/dyvane-redalious/' in plain
          assert '/myths/dyvane-vs-xael-gath/' in plain
          assert (root/'search/opensearch.xml').exists()
          print(f"validated {meta['records']} unified records including {len(myths)} Myth and {len(scales)} Crossscaling routes")
          PY

      - name: Commit generated search data and static page when changed
        run: |
          if git diff --quiet -- data/search-index.json data/search-index-meta.json data/search-index-*.json search/index.html search/index.txt search/opensearch.xml; then
            echo 'Search corpus and static search surface already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/search-index.json data/search-index-meta.json data/search-index-*.json search/index.html search/index.txt search/opensearch.xml
          git commit -m 'SEARCH-002: regenerate static unified search'
          git push
