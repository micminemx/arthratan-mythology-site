name: Build public AI corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-ai-corpus.py'
      - 'data/characters.json'
      - 'data/zubaida-index.json'
      - 'sources/zubaida/**'
      - 'data/divine.json'
      - 'data/hgl-pages.json'
      - 'data/new-canon.json'
      - 'data/causal-ontology.json'
      - 'data/hgl-glossary.json'

permissions:
  contents: write

concurrency:
  group: ai-public-corpus-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate complete-text AI corpus
        env:
          AI_SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/build-ai-corpus.py

      - name: Validate generated surface
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('ai')
          m=json.loads((root/'index.json').read_text(encoding='utf-8'))
          assert m['record_count']==802
          assert m['counts']=={'character':43,'concept':19,'divine':317,'hgl':293,'living-canon':8,'provenance':4,'zubaida':118}
          assert (root/'corpus.jsonl').exists()
          assert (root/'entities'/'dyvane-redalious.json').exists()
          d=json.loads((root/'entities'/'dyvane-redalious.json').read_text(encoding='utf-8'))
          assert d['counts'].get('zubaida',0)>0 and d['records']>1
          print({'records':m['record_count'],'dyvane':d['counts']})
          PY

      - name: Fail closed if main advanced during generation
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

      - name: Commit generated public corpus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai/
          if git diff --cached --quiet; then
            echo 'AI corpus already current.'
            exit 0
          fi
          git commit -m 'AI-LIVE-001: generate public AI corpus'
          git push origin HEAD:main
