name: Build public AI corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-ai-corpus.py'
      - 'data/characters.json'
      - 'data/zubaida-index.json'
      - 'sources/zubaida/**'
      - 'data/divine.json'
      - 'data/hgl-pages.json'
      - 'data/new-canon.json'
      - 'data/causal-ontology.json'
      - 'data/hgl-glossary.json'
      - 'myths/**'
      - 'crossscaling/**'
      - '.github/workflows/build-ai-corpus.yml'

permissions:
  contents: write

concurrency:
  group: ai-public-corpus-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align AI generator with current concept metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build-ai-corpus.py')
          text=p.read_text(encoding='utf-8')
          old_title='title=c["title"]'
          new_title='title=(c.get("title") or c.get("name") or cid.replace("-", " ").title())'
          if old_title in text:
              text=text.replace(old_title,new_title,1)
          elif new_title not in text:
              raise SystemExit('Expected causal concept title expression not found')
          old_count='"concept": 19,'
          new_count='"concept": 27,'
          if old_count in text:
              text=text.replace(old_count,new_count,1)
          elif new_count not in text:
              raise SystemExit('Expected concept count baseline not found')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Generate complete-text AI corpus
        env:
          AI_SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/build-ai-corpus.py

      - name: Validate generated source/publication boundary
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('ai')
          m=json.loads((root/'index.json').read_text(encoding='utf-8'))
          base={'character':43,'concept':27,'divine':317,'hgl':293,'living-canon':8,'provenance':4,'zubaida':118}
          assert m['validation']['base_expected_counts']==base
          assert m['record_count']==sum(m['counts'].values())
          assert m['counts'].get('myth',0)>=1
          assert m['counts'].get('crossscaling',0)>=1
          assert m['validation']['publication_counts_dynamic']['myth']==m['counts']['myth']
          assert m['validation']['publication_counts_dynamic']['crossscaling']==m['counts']['crossscaling']
          assert m['validation']['crossscaling_noncanon_boundary_verified'] is True
          assert (root/'corpus.jsonl').exists()
          assert (root/'shards'/'myth.jsonl').exists()
          assert (root/'shards'/'crossscaling.jsonl').exists()
          assert (root/'entities'/'dyvane-redalious.json').exists()
          d=json.loads((root/'entities'/'dyvane-redalious.json').read_text(encoding='utf-8'))
          assert d['counts'].get('zubaida',0)>0
          assert d['counts'].get('myth',0)>0
          assert d['counts'].get('crossscaling',0)>0
          cross=[json.loads(line) for line in (root/'shards'/'crossscaling.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert cross and all('NONCANON' in r['full_text'] for r in cross)
          myth=[json.loads(line) for line in (root/'shards'/'myth.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert any(r['canonical_route'].endswith('/myths/dyvane-vs-xael-gath/') for r in myth)
          assert any(r['canonical_route'].endswith('/myths/rhayhara-inzra-annaris-six-clashes/') for r in myth)
          assert any(r['canonical_route'].endswith('/crossscaling/rhayhara-inzra-annaris-six-clashes/') for r in cross)
          print({'records':m['record_count'],'counts':m['counts'],'dyvane':d['counts']})
          PY

      - name: Fail closed if main advanced during generation
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

      - name: Commit generated public corpus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai/
          if git diff --cached --quiet; then
            echo 'AI corpus already current.'
            exit 0
          fi
          git commit -m 'AI-LIVE-001: generate public AI corpus'
          git push origin HEAD:main
