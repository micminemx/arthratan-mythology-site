name: Audit retired Drive snapshot (manual, non-mutating)

# OPS-001 source-of-truth rule:
# - GitHub `main` is the authoritative implementation and published source.
# - Google Drive stores coordination/source/backup material only.
# - The legacy Drive browser preview must never write back to `main` automatically.
#
# This workflow is intentionally manual and read-only. It keeps the old Drive
# preview available for explicit comparison/audit without creating a competing
# publication path.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-legacy-drive-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative GitHub source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download legacy Drive preview for inspection only
        run: |
          python -m pip install --quiet gdown
          gdown "https://drive.google.com/uc?id=1pLoDFQuicjCzVznCdZGQKiHMi3VBXRn6" -O /tmp/codex-preview.html
          test -s /tmp/codex-preview.html

      - name: Record non-mutating audit evidence
        run: |
          {
            echo "## Legacy Drive snapshot audit"
            echo
            echo "- GitHub ref: \`$GITHUB_SHA\`"
            echo "- Legacy Drive preview SHA-256: \`$(sha256sum /tmp/codex-preview.html | awk '{print $1}')\`"
            echo "- This job has read-only repository permissions and performs no commit, push, Pages rebuild, or repository-file generation."
            echo "- Any future Drive import must be implemented as a separate explicit, diff-reviewed, SHA/version-guarded process."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert audit did not mutate repository working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: retired Drive audit modified the repository working tree." >&2
            git status --short >&2
            exit 1
          fi
          echo "Repository remains unchanged; GitHub main stays authoritative."
