name: Semantic IA and OmniIndex V2 post-clan gate

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.html"
      - "app.js"
      - "archive.js"
      - "data/**"
      - "scripts/omniindex-v2.py"
      - "scripts/register-publication-graph.py"
      - "scripts/normalize-static-spa-links.py"
      - "scripts/normalize-clan-links.py"
      - ".github/workflows/semantic-ia-gate-v2.yml"

permissions:
  contents: read

concurrency:
  group: semantic-ia-post-clan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-ia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate audit and repair tooling syntax
        run: python -m py_compile scripts/omniindex-v2.py scripts/register-publication-graph.py scripts/normalize-static-spa-links.py scripts/normalize-clan-links.py

      - name: Run exact multi-edge OmniIndex V2 gate
        run: python scripts/omniindex-v2.py . --out-dir reports/architecture/omniindex-v2

      - name: Upload semantic architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omniindex-v2-post-clan-${{ github.sha }}
          path: reports/architecture/omniindex-v2/
          if-no-files-found: warn
          retention-days: 30
