name: Normalize clan navigation links

on:
  workflow_dispatch:
  push:
    paths:
      - "clans/**"
      - "scripts/normalize-clan-links.py"
      - ".github/workflows/normalize-clan-links.yml"

permissions:
  contents: write

concurrency:
  group: normalize-clan-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair unimplemented clan SPA aliases
        run: |
          python -m py_compile scripts/normalize-clan-links.py
          python scripts/normalize-clan-links.py

      - name: Verify obsolete alias removed
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -F 'href="/#clans"' clans --include='*.html'; then
            echo "Unimplemented /#clans alias remains"
            exit 1
          fi
          echo "Clan static navigation is canonicalized to /clans/."

      - name: Commit repaired clan pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clans/
          if git diff --cached --quiet; then
            echo "Clan links already normalized."
            exit 0
          fi
          git commit -m "Normalize clan static navigation links"
          git push
