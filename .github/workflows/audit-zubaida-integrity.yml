name: Audit Zubaida preservation integrity
on:
  push:
    paths:
      - '.github/workflows/audit-zubaida-integrity.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check archive reader
        run: node --check archive.js
      - name: Generate integrity report
        shell: python
        run: |
          import json, pathlib, re, subprocess
          root = pathlib.Path('.')
          index = json.loads((root/'data/zubaida-index.json').read_text(encoding='utf-8'))
          nonsource = json.loads((root/'data/zubaida-nonsource.json').read_text(encoding='utf-8'))
          ledger = json.loads((root/'data/zubaida-attachments.json').read_text(encoding='utf-8'))
          status = json.loads((root/'data/zubaida-preservation-status.json').read_text(encoding='utf-8'))
          non_ids = {r['id'] for r in nonsource.get('non_source_records', [])}
          source_ids = [i for i in index.get('ids', []) if i not in non_ids]
          source_files = sorted(p.stem for p in (root/'sources/zubaida').glob('*.txt'))
          missing_sources = sorted(set(source_ids)-set(source_files))
          unexpected_sources = sorted(set(source_files)-set(source_ids))
          expected_attachments=[]
          for row in ledger.get('messages',[]):
            mid=row['message_id']
            for name in row.get('files',[]):
              expected_attachments.append(f'sources/zubaida/attachments/{mid}/{name}')
          actual_attachments=sorted(str(p.as_posix()) for p in (root/'sources/zubaida/attachments').glob('*/*') if p.is_file())
          missing_attachments=sorted(set(expected_attachments)-set(actual_attachments))
          unexpected_attachments=sorted(set(actual_attachments)-set(expected_attachments))
          archive=(root/'archive.js').read_text(encoding='utf-8')
          html=(root/'index.html').read_text(encoding='utf-8')
          checks={
            'sender_message_count_is_128': index.get('count')==128 and index.get('audit',{}).get('sender_messages')==128,
            'source_id_count_is_118': len(source_ids)==118,
            'nonsource_count_is_10': len(non_ids)==10,
            'source_file_count_is_118': len(source_files)==118,
            'no_missing_source_files': not missing_sources,
            'no_unexpected_source_files': not unexpected_sources,
            'ledger_expected_attachment_count_is_53': len(expected_attachments)==53 and ledger.get('expected_attachment_files')==53,
            'attachment_tree_matches_ledger': not missing_attachments and not unexpected_attachments,
            'reader_has_source_body_parser': 'function txParseTransmission' in archive,
            'reader_filters_nonsource_records': 'function txSourceIds' in archive and 'txLoadNonSource' in archive,
            'reader_supports_attachment_ledger_schema': 'function txAttachmentFiles' in archive and 'att?.messages' in archive,
            'reader_no_longer_labels_missing_as_pending': 'source text is not yet present in the publication package' not in archive,
            'archive_cache_busted': 'archive.js?b=20260902a' in html,
          }
          report={
            'generated':'2026-09-02',
            'head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'counts':{
              'sender_messages':len(index.get('ids',[])),
              'source_bearing_ids':len(source_ids),
              'classified_nonsource_ids':len(non_ids),
              'source_text_files':len(source_files),
              'expected_attachment_files':len(expected_attachments),
              'actual_attachment_files':len(actual_attachments),
              'missing_attachment_files':len(missing_attachments),
            },
            'missing_source_ids':missing_sources,
            'unexpected_source_files':unexpected_sources,
            'missing_attachment_paths':missing_attachments,
            'unexpected_attachment_paths':unexpected_attachments,
            'checks':checks,
            'source_layer_complete': all(v for k,v in checks.items() if not k.startswith('attachment_') and k!='ledger_expected_attachment_count_is_53'),
            'attachment_layer_complete': checks['ledger_expected_attachment_count_is_53'] and checks['attachment_tree_matches_ledger'],
            'complete': all(checks.values()),
            'preservation_status_remaining_source_files':status.get('remaining_source_files')
          }
          (root/'data/zubaida-integrity-audit.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
      - name: Commit audit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/zubaida-integrity-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Zubaida integrity audit'
          git push
